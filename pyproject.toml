[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuse"
version = "0.2.0"
description = "FUSE: compiling heterogeneous secure-computing task graphs onto one reconfigurable datapath"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "The FUSE authors"}]
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "Pillow>=10.0",
  "pytest>=7.4",
  "cryptography>=42.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
